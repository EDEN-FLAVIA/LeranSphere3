name: LearnSphere CI - Quality & Integrity Validation

on:
  push:
    branches:
      - master
      - homepage
      - coursepage
      - course_detailspage
      - featurespage
  pull_request:
    branches:
      - master

jobs:
  validate-and-test:
    name: Code Quality & Integrity Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node environment for linting & verification scripts
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install lightweight validation tools
      - name: Install Linter & Validation Dependencies
        run: |
          npm install -g jsonlint htmlhint stylelint stylelint-config-standard lychee

      # Step 4: Validate Central JSON Data File Syntax
      - name: Validate data/courses.json Syntax
        run: |
          echo "Validating JSON syntax for data/courses.json..."
          jsonlint -p data/courses.json

      # Step 5: Verify Required Project File Structure
      - name: Verify Project File Structure
        run: |
          echo "Checking required project files..."
          required_files=(
            "index.html"
            "courses.html"
            "course-details.html"
            "about.html"
            "css/style.css"
            "css/courses.css"
            "css/details.css"
            "css/about.css"
            "js/main.js"
            "js/courses.js"
            "js/details.js"
            "js/chatbot.js"
            "data/courses.json"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Missing required file: $file"
              exit 1
            fi
          done
          echo "All mandatory project files exist."

      # Step 6: Lint HTML Files
      - name: Lint HTML Files
        run: |
          echo "Running HTMLHint..."
          htmlhint "*.html"

      # Step 7: Lint CSS Files
      - name: Lint CSS Files
        run: |
          echo "Running Stylelint..."
          npx stylelint "css/*.css" --config '{"extends": "stylelint-config-standard"}' || true

      # Step 8: Verify All 12 Mandatory Course IDs in courses.json
      - name: Verify All 12 Mandatory Course IDs
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("data/courses.json", "utf8"));
            const requiredIds = [
              "python", "java", "web-development", "javascript", 
              "react", "sql", "pandas", "machine-learning", 
              "intermediate-machine-learning", "data-visualization", 
              "git-github", "cybersecurity"
            ];
            
            const courses = Array.isArray(data) ? data : data.courses;
            if (!courses) {
              console.error("Error: Could not parse course list array from data/courses.json");
              process.exit(1);
            }
            
            const existingIds = courses.map(c => c.id);
            const missing = requiredIds.filter(id => !existingIds.includes(id));
            
            if (missing.length > 0) {
              console.error("Error: Missing required course IDs:", missing);
              process.exit(1);
            }
            console.log("All 12 required course IDs are correctly defined in data/courses.json!");
          '

      # Step 9: Check Internal Navigation & Broken Links
      - name: Check Broken Links Across HTML Pages
        run: |
          echo "Checking internal and external links..."
          lychee --offline "*.html"
