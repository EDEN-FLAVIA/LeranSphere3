name: LearnSphere CI

on:
  push:
    branches:
      - main
      - homepage
      - coursepage
      - course_detailspage
      - featurespage

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate courses.json
        run: |
          python -m json.tool data/courses.json > /dev/null
          echo "courses.json is valid."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript
        run: |
          node --check js/courses.js
          node --check js/details.js

          echo "JavaScript syntax is valid."

      - name: Check main project files
        run: |
          test -f index.html
          test -f courses.html
          test -f course-details.html

          echo "Main HTML files are present."

      - name: Validation successful
        run: |
          echo "LearnSphere validation completed successfully."
